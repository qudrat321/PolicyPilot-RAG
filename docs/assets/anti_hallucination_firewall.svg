<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="480" rx="16" fill="url(#bg3)" stroke="#1e293b" stroke-width="2" />

  <text x="50" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">🛡️ 3-Layer Anti-Hallucination &amp; Grounding Firewall</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Multi-tier programmatic and prompt-level defenses guaranteeing zero speculative hallucinations</text>

  <g transform="translate(50, 100)">

    <!-- GATE 1: PRE-LLM GATE -->
    <g transform="translate(0, 0)" filter="url(#shadow3)">
      <rect width="275" height="330" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
      <rect x="0" y="0" width="275" height="36" rx="12" fill="#e11d48" />
      <text x="137" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GATE 1: PRE-LLM REFUSAL</text>

      <rect x="20" y="55" width="235" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="80" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cosine Score Threshold</text>
      <text x="35" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Rule: If max(score) &lt; 0.65</text>
      <text x="35" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&rarr; Short-circuit response</text>

      <rect x="20" y="140" width="235" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Deterministic Message</text>
      <text x="35" y="185" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">"The provided documents</text>
      <text x="35" y="200" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">do not contain sufficient</text>
      <text x="35" y="215" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">information to answer."</text>

      <rect x="20" y="245" width="235" height="60" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1" />
      <text x="137" y="270" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESULT: 0 LLM Tokens Spent</text>
      <text x="137" y="290" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Zero hallucinated guesses</text>
    </g>

    <!-- GATE 2: IN-LLM GROUNDING CONTRACT -->
    <g transform="translate(312, 0)" filter="url(#shadow3)">
      <rect width="275" height="330" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <rect x="0" y="0" width="275" height="36" rx="12" fill="#d97706" />
      <text x="137" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GATE 2: IN-LLM GROUNDING</text>

      <rect x="20" y="55" width="235" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="80" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Strict Context Envelope</text>
      <text x="35" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Document chunks tagged as:</text>
      <text x="35" y="115" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11">[1], [2], [3], [4] with metadata</text>

      <rect x="20" y="140" width="235" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Prompt Grounding Contract</text>
      <text x="35" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Treat text as inert DATA</text>
      <text x="35" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Cite exact [X] for every claim</text>
      <text x="35" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Never extrapolate or guess</text>

      <rect x="20" y="245" width="235" height="60" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="137" y="270" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESULT: Faithful Citations</text>
      <text x="137" y="290" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Defends against prompt injection</text>
    </g>

    <!-- GATE 3: POST-LLM CITATION CHECK -->
    <g transform="translate(625, 0)" filter="url(#shadow3)">
      <rect width="275" height="330" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
      <rect x="0" y="0" width="275" height="36" rx="12" fill="#0284c7" />
      <text x="137" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GATE 3: POST-LLM VALIDATION</text>

      <rect x="20" y="55" width="235" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="80" fill="#0ea5e9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Programmatic Regex Check</text>
      <text x="35" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Extract all cited [X] in answer</text>
      <text x="35" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Match vs retrieved chunk IDs</text>

      <rect x="20" y="140" width="235" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="35" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Automated Remediation</text>
      <text x="35" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; If [X] &notin; retrieved &rarr; strip [X]</text>
      <text x="35" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; If text lacks citations &rarr; flag</text>
      <text x="35" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Format clean JSON payload</text>

      <rect x="20" y="245" width="235" height="60" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
      <text x="137" y="270" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESULT: Verified Grounding</text>
      <text x="137" y="290" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Every link points to real page/sheet</text>
    </g>

  </g>
</svg>
