<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="640" rx="16" fill="url(#bg2)" stroke="#1e293b" stroke-width="2" />

  <text x="50" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">🔄 Ingestion &amp; Grounded Query Workflow</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Detailed flowchart showing document streaming, chunking, embedding, retrieval, and citation verification</text>

  <!-- WORKFLOW 1: INGESTION PIPELINE -->
  <g transform="translate(50, 95)" filter="url(#shadow2)">
    <rect width="900" height="235" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="0" y="0" width="900" height="32" rx="12" fill="#0284c7" />
    <text x="25" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PIPELINE A: DOCUMENT &amp; SPREADSHEET INGESTION</text>

    <!-- Node 1 -->
    <rect x="25" y="55" width="145" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="97" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Upload &amp; Hash</text>
    <text x="35" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Validate &le;5MB</text>
    <text x="35" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Check extension</text>
    <text x="35" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; SHA-256 hash</text>
    <text x="35" y="165" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10">409 if duplicate</text>

    <!-- Arrow 1-2 -->
    <path d="M 170 130 L 205 130" stroke="#0ea5e9" stroke-width="2" fill="none" />
    <polygon points="203,126 211,130 203,134" fill="#0ea5e9" />

    <!-- Node 2 -->
    <rect x="210" y="55" width="155" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="287" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Stream Extract</text>
    <text x="220" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; PDF (PyMuPDF)</text>
    <text x="220" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; DOCX headings</text>
    <text x="220" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; openpyxl stream</text>
    <text x="220" y="165" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Low RAM &lt;120MB</text>

    <!-- Arrow 2-3 -->
    <path d="M 365 130 L 400 130" stroke="#0ea5e9" stroke-width="2" fill="none" />
    <polygon points="398,126 406,130 398,134" fill="#0ea5e9" />

    <!-- Node 3 -->
    <rect x="405" y="55" width="160" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="485" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Markdown Chunk</text>
    <text x="415" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Repeated headers</text>
    <text x="415" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; 8 rows per chunk</text>
    <text x="415" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Sheet summary</text>
    <text x="415" y="165" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Retains table context</text>

    <!-- Arrow 3-4 -->
    <path d="M 565 130 L 600 130" stroke="#0ea5e9" stroke-width="2" fill="none" />
    <polygon points="598,126 606,130 598,134" fill="#0ea5e9" />

    <!-- Node 4 -->
    <rect x="605" y="55" width="135" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="672" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Batch Embed</text>
    <text x="615" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; text-embedding-004</text>
    <text x="615" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Batch size: 20</text>
    <text x="615" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; 768 dimensions</text>
    <text x="615" y="165" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Google AI Studio</text>

    <!-- Arrow 4-5 -->
    <path d="M 740 130 L 775 130" stroke="#0ea5e9" stroke-width="2" fill="none" />
    <polygon points="773,126 781,130 773,134" fill="#0ea5e9" />

    <!-- Node 5 -->
    <rect x="780" y="55" width="105" height="150" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="832" y="80" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5. Upsert</text>
    <text x="790" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Qdrant Cloud</text>
    <text x="790" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Save vectors</text>
    <text x="790" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Save text</text>
    <text x="790" y="165" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">in payload</text>
  </g>

  <!-- WORKFLOW 2: QUESTION & ANSWER RETRIEVAL -->
  <g transform="translate(50, 360)" filter="url(#shadow2)">
    <rect width="900" height="235" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="900" height="32" rx="12" fill="#059669" />
    <text x="25" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PIPELINE B: QUESTION RETRIEVAL &amp; GROUNDED ANSWERING</text>

    <!-- Step 1 -->
    <rect x="25" y="55" width="145" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="97" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. User Query</text>
    <text x="35" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Visitor question</text>
    <text x="35" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Rate check (5/min)</text>
    <text x="35" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Embed query</text>
    <text x="35" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">via same model</text>

    <!-- Arrow 1-2 -->
    <path d="M 170 130 L 205 130" stroke="#10b981" stroke-width="2" fill="none" />
    <polygon points="203,126 211,130 203,134" fill="#10b981" />

    <!-- Step 2 -->
    <rect x="210" y="55" width="155" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="287" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. Qdrant Search</text>
    <text x="220" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Cosine similarity</text>
    <text x="220" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Top-4 chunks</text>
    <text x="220" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Pull payload text</text>
    <text x="220" y="165" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Scores e.g. 0.81</text>

    <!-- Arrow 2-3 -->
    <path d="M 365 130 L 400 130" stroke="#10b981" stroke-width="2" fill="none" />
    <polygon points="398,126 406,130 398,134" fill="#10b981" />

    <!-- Step 3 -->
    <rect x="405" y="55" width="160" height="150" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <text x="485" y="80" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. Score Gate</text>
    <text x="415" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Max score &ge; 0.65?</text>
    <text x="415" y="125" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11">&bull; If NO &rarr; REFUSE</text>
    <text x="415" y="145" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">&bull; If YES &rarr; Pass</text>
    <text x="415" y="165" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">0 Tokens on Refusal</text>

    <!-- Arrow 3-4 -->
    <path d="M 565 130 L 600 130" stroke="#10b981" stroke-width="2" fill="none" />
    <polygon points="598,126 606,130 598,134" fill="#10b981" />

    <!-- Step 4 -->
    <rect x="605" y="55" width="135" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="672" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Gemini Flash</text>
    <text x="615" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Grounded prompt</text>
    <text x="615" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Cited tags [1], [2]</text>
    <text x="615" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Strict refusal rules</text>
    <text x="615" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">15 RPM Throttled</text>

    <!-- Arrow 4-5 -->
    <path d="M 740 130 L 775 130" stroke="#10b981" stroke-width="2" fill="none" />
    <polygon points="773,126 781,130 773,134" fill="#10b981" />

    <!-- Step 5 -->
    <rect x="780" y="55" width="105" height="150" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="832" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5. Delivery</text>
    <text x="790" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Verify [X] IDs</text>
    <text x="790" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Strip ungrounded</text>
    <text x="790" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Send JSON</text>
    <text x="790" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">to React UI</text>
  </g>
</svg>
