<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="50" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">🧭 PolicyPilot RAG - Production System Architecture</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Zero-Cost Free Tier Architecture (Vercel + Render + Qdrant Cloud + Google AI Studio)</text>

  <!-- LAYER 1: CLIENT LAYER -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <rect width="260" height="480" rx="12" fill="url(#blueCard)" stroke="#0284c7" stroke-width="2" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#0369a1" />
    <text x="130" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CLIENT LAYER (Vercel CDN)</text>
    
    <!-- Badge -->
    <rect x="20" y="50" width="90" height="20" rx="6" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
    <text x="65" y="64" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">0s Cold Start</text>

    <!-- Component 1 -->
    <rect x="20" y="85" width="220" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="110" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">React + Vite + Tailwind</text>
    <text x="35" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fast, responsive UI loaded</text>
    <text x="35" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">from global Edge CDN</text>

    <!-- Component 2 -->
    <rect x="20" y="175" width="220" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="200" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Document Upload View</text>
    <text x="35" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PDF, Word, CSV, Multi-Sheet</text>
    <text x="35" y="236" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Excel file validation &amp; status</text>

    <!-- Component 3 -->
    <rect x="20" y="265" width="220" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="290" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Question &amp; Answer View</text>
    <text x="35" y="310" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Grounded answers with</text>
    <text x="35" y="326" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">exact source citations [1], [2]</text>

    <!-- Component 4 -->
    <rect x="20" y="355" width="220" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="380" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Chunk Inspector Panel</text>
    <text x="35" y="400" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Live transparency viewer:</text>
    <text x="35" y="416" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Cosine scores (e.g. 0.84)</text>
    <text x="35" y="432" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Page &amp; sheet-row metadata</text>
  </g>

  <!-- LAYER 2: BACKEND & GATEWAY -->
  <g transform="translate(370, 95)" filter="url(#shadow)">
    <rect width="260" height="480" rx="12" fill="url(#blueCard)" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#059669" />
    <text x="130" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">GATEWAY &amp; INGESTION (Render)</text>

    <!-- Badge -->
    <rect x="20" y="50" width="105" height="20" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" />
    <text x="72" y="64" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">&lt;120MB Low-RAM</text>

    <!-- Component 1 -->
    <rect x="20" y="85" width="220" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="110" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">FastAPI Gateway</text>
    <text x="35" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pydantic v2 validation</text>
    <text x="35" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SHA-256 deduplication</text>

    <!-- Component 2 -->
    <rect x="20" y="175" width="220" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="200" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Streaming Ingestion</text>
    <text x="35" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">openpyxl read_only=True</text>
    <text x="35" y="236" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">PyMuPDF, docx, pptx parsers</text>

    <!-- Component 3 -->
    <rect x="20" y="265" width="220" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="290" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Markdown Table Chunker</text>
    <text x="35" y="310" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Repeated headers on every chunk</text>
    <text x="35" y="326" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">+ Multi-sheet overview chunk</text>

    <!-- Component 4 -->
    <rect x="20" y="355" width="220" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="380" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Guardrails &amp; Refusal Gate</text>
    <text x="35" y="400" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Score &lt; 0.65 &rarr; Refuse (0 tokens)</text>
    <text x="35" y="416" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Citation regex cross-check</text>
    <text x="35" y="432" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Rate limiter (slowapi)</text>
  </g>

  <!-- LAYER 3: CLOUD AI & VECTOR STORE -->
  <g transform="translate(690, 95)" filter="url(#shadow)">
    <rect width="260" height="480" rx="12" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="260" height="36" rx="12" fill="#d97706" />
    <text x="130" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CLOUD SERVICES ($0 Free)</text>

    <!-- Badge -->
    <rect x="20" y="50" width="105" height="20" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="72" y="64" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Persistent &amp; Free</text>

    <!-- Component 1 -->
    <rect x="20" y="85" width="220" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="110" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Qdrant Cloud Free Tier</text>
    <text x="35" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">1GB RAM / 4GB storage cluster</text>
    <text x="35" y="146" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Full chunk text stored in payload</text>
    <text x="35" y="162" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">(No paid S3/GCS needed!)</text>

    <!-- Component 2 -->
    <rect x="20" y="195" width="220" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="220" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">text-embedding-004</text>
    <text x="35" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Google AI Studio API (Free)</text>
    <text x="35" y="256" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">768-dim high-precision vectors</text>
    <text x="35" y="272" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Saves 800MB RAM vs PyTorch</text>

    <!-- Component 3 -->
    <rect x="20" y="305" width="220" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="35" y="330" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gemini 1.5 / 2.0 Flash</text>
    <text x="35" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Google AI Studio Free Tier</text>
    <text x="35" y="366" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">15 RPM / 1,500 RPD / 1M TPM</text>
    <text x="35" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Faithful grounded responses</text>

    <!-- Component 4 -->
    <rect x="20" y="415" width="220" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="130" y="440" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">100% Free - $0 Cloud Spend</text>
  </g>

  <!-- Connective Arrows -->
  <path d="M 310 220 L 370 220" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <polygon points="368,215 376,220 368,225" fill="#0ea5e9" />

  <path d="M 370 380 L 310 380" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <polygon points="312,375 304,380 312,385" fill="#10b981" />

  <path d="M 630 220 L 690 220" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <polygon points="688,215 696,220 688,225" fill="#10b981" />

  <path d="M 690 380 L 630 380" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <polygon points="632,375 624,380 632,385" fill="#f59e0b" />
</svg>
