services:
  - type: web
    name: policypilot-rag-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: policy_documents
      - key: ENVIRONMENT
        value: production
      - key: SIMILARITY_THRESHOLD
        value: 0.65
      - key: TOP_K_CHUNKS
        value: 4
