services:
  - type: web
    name: policypilot-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: policy_documents
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SIMILARITY_THRESHOLD
        value: 0.58
      - key: TOP_K_CHUNKS
        value: 4
      - key: MAX_TOTAL_VECTORS
        value: 1500
