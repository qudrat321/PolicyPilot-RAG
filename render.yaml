services:
  - type: web
    name: policypilot-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: policy_documents
      - key: ENVIRONMENT
        value: production
      - key: SIMILARITY_THRESHOLD
        value: 0.58
      - key: TOP_K_CHUNKS
        value: 5
