services:
  - type: web
    name: policypilot-rag
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: policy_documents
      - key: VITE_SUPABASE_URL
        value: https://tfzatlcopjuhtcxvwyhy.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_Cl2sT5DuueLO6Ynf1vukQw_pg-DzK_w
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SIMILARITY_THRESHOLD
        value: 0.58
      - key: TOP_K_CHUNKS
        value: 4
      - key: MAX_TOTAL_VECTORS
        value: 1500
